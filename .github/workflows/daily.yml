name: Daily reward bot

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python daily_bot.py
        env:
          GAME_URL: ${{ secrets.GAME_URL }}
          GAME_USER: ${{ secrets.GAME_USER }}
          GAME_PASS: ${{ secrets.GAME_PASS }}
